<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="lb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="lb-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Sleek dark squircle background -->
  <rect width="64" height="64" rx="16" fill="url(#lb-bg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Left Code Bracket < -->
  <path d="M22 22 L13 32 L22 42" stroke="url(#lb-accent)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Code Bracket > -->
  <path d="M42 22 L51 32 L42 42" stroke="url(#lb-accent)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center Slash / Accent Bar -->
  <path d="M35 19 L29 45" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round"/>

  <!-- Glowing indicator dot -->
  <circle cx="48" cy="16" r="3.5" fill="#10b981"/>
</svg>